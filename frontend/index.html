<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f5d8c">
<title>GramSetu</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header>
 <h1>GramSetu</h1>
 <select id="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ta">தமிழ்</option></select>
 <button id="readpage" class="pill ghost" data-act="readpage" data-i18n-aria="read_page" data-i18n-title="read_page">🔊</button>
 <button id="auth-btn" class="pill ghost" data-act="auth"></button>
 <button id="net" class="pill" data-act="tab" data-arg="queue" role="status" aria-live="polite"></button>
</header>
<div id="demo-banner" class="banner hidden" data-i18n="demo_state_off"></div>
<nav id="tabs" aria-label="GramSetu">
 <button data-act="tab" data-arg="home">🏠 <span data-i18n="n_home"></span></button>
 <button data-act="tab" data-arg="report">📝 <span data-i18n="report"></span></button>
 <button data-act="tab" data-arg="health">🏥 <span data-i18n="n_health"></span></button>
 <button data-act="tab" data-arg="farm">🌾 <span data-i18n="n_farm"></span></button>
 <button data-act="tab" data-arg="docs">📄 <span data-i18n="n_docs"></span></button>
 <button data-act="tab" data-arg="sos" class="sos-tab">🚨 <span data-i18n="n_sos"></span></button>
 <button data-act="tab" data-arg="schemes">📋 <span data-i18n="schemes"></span></button>
 <button data-act="tab" data-arg="queue">🔄 <span data-i18n="n_queue"></span></button>
 <button data-act="tab" data-arg="admin" id="tab-admin" class="hidden">🛠 <span data-i18n="n_admin"></span></button>
</nav>
<main id="main" tabindex="-1">
<section id="home"></section>
<section id="report" class="hidden">
 <form id="report-form" novalidate>
 <label for="name" data-i18n="name"></label><input id="name" autocomplete="name">
 <label for="village" data-i18n="village"></label><input id="village">
 <label for="text" data-i18n="text"></label><textarea id="text" aria-describedby="hint"></textarea>
 <div class="row"><button type="button" class="btn alt" id="mic"></button><button type="button" class="btn ghost" id="speak"></button><button type="button" class="btn ghost stop-speak" data-act="stopspeak" data-i18n="stop_speak"></button></div>
 <div id="listening" class="listening hidden" role="status" data-i18n="v_listening"></div>
 <div id="hint" aria-live="polite"></div>
 <div class="row"><button class="btn" id="send" type="submit"></button></div>
 </form>
</section>
<section id="health" class="hidden"></section>
<section id="farm" class="hidden"></section>
<section id="docs" class="hidden"></section>
<section id="sos" class="hidden"></section>
<section id="schemes" class="hidden"></section>
<section id="queue" class="hidden"></section>
<section id="admin" class="hidden"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<button id="chat-fab" class="fab" data-act="chat" data-i18n-aria="chat_open" data-i18n-title="chat_open">💬</button>
<aside id="chat" class="hidden" role="dialog" aria-labelledby="chat-title">
 <div class="chat-head"><strong id="chat-title" data-i18n="chat_title"></strong>
  <span><button class="pill ghost stop-speak" data-act="stopspeak" data-i18n="stop_speak"></button>
  <button class="pill ghost" data-act="chatclose" data-i18n-aria="close">✕</button></span></div>
 <div id="chat-log" role="log" aria-live="polite"></div>
 <div id="chat-chips"></div>
 <div id="chat-listening" class="listening hidden" role="status" data-i18n="v_listening"></div>
 <p class="note" data-i18n="chat_note"></p>
 <form id="chat-form" class="chat-form"><label class="sr" for="chat-in" data-i18n="chat_ph"></label>
  <input id="chat-in" autocomplete="off" data-i18n-ph="chat_ph"><button type="button" class="btn alt" id="chat-mic" data-i18n-aria="mic">🎤</button><button class="btn" data-i18n="chat_send"></button></form>
</aside>
<dialog id="auth-dlg"><form id="auth-form" novalidate><h2 data-i18n="auth_title"></h2>
 <div id="auth-reg"><label for="a-name" data-i18n="name"></label><input id="a-name" autocomplete="name">
 <label for="a-village" data-i18n="village"></label><input id="a-village"></div>
 <label for="a-user" data-i18n="username"></label><input id="a-user" autocomplete="username" autocapitalize="none">
 <label for="a-pass" data-i18n="password"></label><input id="a-pass" type="password" autocomplete="current-password">
 <p id="auth-err" class="err" role="alert"></p>
 <div class="row"><button class="btn" id="auth-go" type="submit"></button><button type="button" class="btn ghost" data-act="authclose" data-i18n="cancel"></button></div>
 <p><button type="button" class="link" data-act="authswitch" id="auth-sw"></button></p></form></dialog>
<dialog id="sos-dlg"><form method="dialog" id="sos-form"><h2 data-i18n="sos_confirm_t"></h2><p data-i18n="sos_confirm_b"></p>
 <label for="sos-note" data-i18n="sos_note"></label><textarea id="sos-note" maxlength="500"></textarea>
 <label class="chk"><input type="checkbox" id="sos-loc" checked> <span data-i18n="sos_loc"></span></label>
 <div class="row"><button type="button" class="btn danger" id="sos-yes" data-i18n="sos_yes"></button><button type="button" class="btn ghost" data-act="sosclose" data-i18n="cancel"></button></div></form></dialog>
<script src="i18n.js"></script><script src="content.js"></script><script src="app.js"></script></body></html>
